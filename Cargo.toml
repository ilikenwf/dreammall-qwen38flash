[package]
name = "dreammall"
version = "0.1.0"
edition = "2021"
description = "DREAM MALL — a small procedurally generated 3D dream-sim (Phase 1)"
license = "MIT OR Apache-2.0"

[dependencies]
# `audio` deliberately off: macroquad's audio feature pulls in quad-snd, which
# opens `default`, demands 44100 Hz / FLOAT_LE / a 4096-frame buffer, and panics
# on a private thread when any of that is refused. `src/alsa.rs` talks to
# libasound directly and asks the device what it supports instead.
macroquad = { version = "=0.4.16" }

[profile.release]
opt-level = 2
